name: Deploy Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build static site
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          BASE="/$REPO/"
          # user/org pages repos are served from the domain root
          if [ "$REPO" = "$OWNER.github.io" ]; then BASE="/"; fi
          echo "Base path: $BASE"
          STATIC=1 BASE_PATH="$BASE" bun run build
      - name: Prepare static output
        run: |
          OUT=dist/client
          if [ ! -d "$OUT" ]; then OUT=.output/public; fi
          echo "Publishing $OUT"
          cp "$OUT/index.html" "$OUT/404.html" 2>/dev/null || true
          touch "$OUT/.nojekyll"
          echo "OUT=$OUT" >> $GITHUB_ENV
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT }}
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
